# Compila Nexus Launcher per Windows, macOS (DMG universale Intel + Apple Silicon) e Linux
# (AppImage, deb, rpm, pacchetto pacman per Arch) e crea la GitHub Release con gli installer: https://nexusmc.online
# linka https://github.com/TiclyMusic/nexus-client/releases/latest/download/<file>.
#
# Avvio: push di un tag `v*` (es. `git tag v0.3.0 && git push origin v0.3.0`) oppure
# manualmente da "Actions → release → Run workflow".
#
# Aggiornamenti automatici: con il secret TAURI_SIGNING_PRIVATE_KEY (chiave privata creata con
# `npx tauri signer generate`) gli installer vengono firmati e la release include latest.json,
# che il launcher controlla per aggiornarsi da solo. Senza il secret la build funziona lo stesso
# ma senza aggiornamento automatico.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Crea la GitHub Release al termine"
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: ubuntu-22.04
            name: linux
          - platform: macos-latest
            name: macos
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze di sistema (Linux)
        if: matrix.name == 'linux'
        # un mirror di Ubuntu bloccato ha già tenuto ferma una release per 6 ore
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libssl-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Test backend
        if: matrix.name == 'linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        env:
          # linuxdeploy (AppImage) fallisce a fare lo strip delle librerie recenti di Ubuntu
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY non impostato: niente aggiornamenti automatici"
            npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build ${{ matrix.args }}
          fi

      - name: Raccogli gli installer (nomi stabili)
        run: |
          mkdir -p out
          B=src-tauri/target/release/bundle
          case "${{ matrix.name }}" in
            windows)
              cp "$B"/nsis/*-setup.exe out/nexus-launcher-setup.exe
              cp "$B"/nsis/*-setup.exe.sig out/nexus-launcher-setup.exe.sig 2>/dev/null || true
              cp "$B"/msi/*.msi out/nexus-launcher.msi ;;
            linux)
              cp "$B"/appimage/*.AppImage out/nexus-launcher.AppImage
              cp "$B"/appimage/*.AppImage.sig out/nexus-launcher.AppImage.sig 2>/dev/null || true
              cp "$B"/deb/*.deb out/nexus-launcher.deb
              cp "$B"/rpm/*.rpm out/nexus-launcher.rpm ;;
            macos)
              M=src-tauri/target/universal-apple-darwin/release/bundle
              cp "$M"/dmg/*.dmg out/nexus-launcher.dmg
              # pacchetto usato dall'aggiornamento automatico su macOS
              if ls "$M"/macos/*.app.tar.gz >/dev/null 2>&1; then
                cp "$M"/macos/*.app.tar.gz out/nexus-launcher.app.tar.gz
                cp "$M"/macos/*.app.tar.gz.sig out/nexus-launcher.app.tar.gz.sig
              fi ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # Pacchetto pacman per Arch Linux, ricavato dal .deb con packaging/arch/PKGBUILD.
  arch:
    needs: build
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: linux

      - name: makepkg
        run: |
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          useradd -m builder
          mkdir -p /tmp/pkg
          cp packaging/arch/PKGBUILD /tmp/pkg/
          sed -i "s/^pkgver=.*/pkgver=$ver/" /tmp/pkg/PKGBUILD
          # stesso nome della source del PKGBUILD: makepkg usa il file locale invece di scaricarlo
          cp linux/nexus-launcher.deb "/tmp/pkg/nexus-launcher-$ver.deb"
          chown -R builder /tmp/pkg
          # --nodeps: per impacchettare non servono webkit2gtk e gtk3 installati
          su builder -c "cd /tmp/pkg && makepkg --nodeps --noconfirm"
          mkdir -p out
          cp /tmp/pkg/nexus-launcher-bin-*.pkg.tar.zst out/nexus-launcher.pkg.tar.zst
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installer-arch
          path: out/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, arch]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist

      - name: Versione
        id: v
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # Manifest per l'aggiornamento automatico (solo se gli installer sono stati firmati).
      - name: latest.json
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node - <<'JS'
          const fs = require("fs");
          const { TAG, VERSION, REPO } = process.env;
          const url = (f) => `https://github.com/${REPO}/releases/download/${TAG}/${f}`;
          const entry = (f) => fs.existsSync(`dist/${f}.sig`) ? { signature: fs.readFileSync(`dist/${f}.sig`, "utf8").trim(), url: url(f) } : null;
          const platforms = {};
          const win = entry("nexus-launcher-setup.exe");
          const mac = entry("nexus-launcher.app.tar.gz");
          const linux = entry("nexus-launcher.AppImage");
          if (win) platforms["windows-x86_64"] = win;
          if (mac) { platforms["darwin-x86_64"] = mac; platforms["darwin-aarch64"] = mac; }
          if (linux) platforms["linux-x86_64"] = linux;
          if (!Object.keys(platforms).length) { console.log("Installer non firmati: niente latest.json"); process.exit(0); }
          fs.writeFileSync("dist/latest.json", JSON.stringify({ version: VERSION, notes: `Nexus Launcher ${VERSION}`, pub_date: new Date().toISOString(), platforms }, null, 2));
          console.log(fs.readFileSync("dist/latest.json", "utf8"));
          JS
          rm -f dist/*.sig

      # Nomi dei file fissi: https://github.com/<repo>/releases/latest/download/<file> punta sempre
      # all'ultima versione ed è il link usato da nexusmc.online.
      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          name: Nexus Launcher v${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Scarica la versione per il tuo sistema da https://nexusmc.online

            | Sistema | File |
            |---|---|
            | Windows 10/11 | `nexus-launcher-setup.exe` (consigliato) · `nexus-launcher.msi` |
            | macOS 10.15+ (Intel e Apple Silicon) | `nexus-launcher.dmg` |
            | Linux | `nexus-launcher.AppImage` · `nexus-launcher.deb` · `nexus-launcher.rpm` |
            | Arch Linux | `nexus-launcher.pkg.tar.zst` → `sudo pacman -U nexus-launcher.pkg.tar.zst` |
          files: dist/*
