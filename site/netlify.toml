# Netlify: base directory = site. Pagina statica (nessuna build) + una funzione serverless.
[build]
  publish = "public"

# netlify/functions/has-joined.mjs: proxy della verifica Mojang usato dal server amici
# (Mojang blocca le richieste da Cloudflare Workers).
[functions]
  directory = "netlify/functions"
